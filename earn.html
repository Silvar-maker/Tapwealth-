<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money - TapWealth</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            margin: 0;
            padding: 0;
            color: #1e293b;
        }
        .pay-app-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #94a3b8;
        }
        .nav-item.active {
            color: #1d4ed8;
        }
        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .header {
            background: white;
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-weight: 700;
            font-size: 18px;
            color: #0f172a;
        }
        .balance-card {
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            color: white;
            border-radius: 16px;
            padding: 20px;
            margin: 16px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        .task-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #f1f5f9;
        }
        .task-card.completed {
            opacity: 0.6;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            text-align: center;
            margin-top: 12px;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #1d4ed8;
            color: white;
        }
        .btn-primary:hover {
            background: #1e40af;
            transform: translateY(-2px);
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: #059669;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show {
            opacity: 1;
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(29, 78, 216, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(29, 78, 216, 0); }
            100% { box-shadow: 0 0 0 0 rgba(29, 78, 216, 0); }
    /* Fix: Push content above bottom nav */
body {
    padding-bottom: 70px; /* Height of nav bar + 10px buffer */
}
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <button onclick="history.back()" class="text-gray-500">
            <i class="fas fa-arrow-left"></i>
        </button>
        <h1>Earn Money</h1>
        <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold" id="user-initial">U</div>
    </div>

    <!-- Balance Card -->
    <div class="balance-card">
        <div class="flex justify-between items-center">
            <div>
                <p class="opacity-80">Available Balance</p>
                <p class="text-2xl font-bold mt-1" id="balance">₦0.00</p>
            </div>
            <i class="fas fa-wallet text-3xl"></i>
        </div>
    </div>

    <!-- Earn Sections -->
    <div class="task-card">
        <div class="flex items-start">
            <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center mr-3">
                <i class="fas fa-tv text-red-600"></i>
            </div>
            <div class="flex-1">
                <h3 class="font-bold">Watch Ads</h3>
                <p class="text-sm text-gray-600 mt-1">Earn ₦10–₦50 per ad (30–60 sec)</p>
                <p class="text-sm text-green-600 font-medium mt-2">₦30 per task • 5 tasks available</p>
            </div>
        </div>
        <button id="watchAdsBtn" class="btn btn-primary pulse">👉 Watch & Earn Now</button>
    </div>

    <div class="task-card">
        <div class="flex items-start">
            <div class="w-10 h-10 rounded-full bg-yellow-100 flex items-center justify-center mr-3">
                <i class="fas fa-list-check text-yellow-600"></i>
            </div>
            <div class="flex-1">
                <h3 class="font-bold">Complete Surveys</h3>
                <p class="text-sm text-gray-600 mt-1">Answer short questions, get paid</p>
                <p class="text-sm text-green-600 font-medium mt-2">₦100–₦500 per survey</p>
            </div>
        </div>
        <button class="btn btn-success" onclick="showComingSoon()">Start Survey</button>
    </div>

    <div class="task-card">
        <div class="flex items-start">
            <div class="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center mr-3">
                <i class="fas fa-mobile-alt text-purple-600"></i>
            </div>
            <div class="flex-1">
                <h3 class="font-bold">Test Apps</h3>
                <p class="text-sm text-gray-600 mt-1">Download, open, and earn instantly</p>
                <p class="text-sm text-green-600 font-medium mt-2">₦150 per app</p>
            </div>
        </div>
        <button class="btn btn-success" onclick="showComingSoon()">Try Apps</button>
    </div>

    <!-- Bottom Nav -->
    <div class="pay-app-nav">
        <a href="dashboard.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="earn.html" class="nav-item active">
            <i class="fas fa-coins"></i>
            <span>Earn</span>
        </a>
        <a href="referral.html" class="nav-item">
            <i class="fas fa-users"></i>
            <span>Refer</span>
        </a>
        <a href="shop.html" class="nav-item">
            <i class="fas fa-shopping-bag"></i>
            <span>Shop</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Me</span>
        </a>
    </div>

    <div class="toast" id="toast">Message</div>

    <script>
        const USERS_KEY = 'tapwealth_users';
        const CURRENT_USER_EMAIL_KEY = 'tapwealth_current_user_email';
        let currentUser = null;

        function getCurrentUser() {
            const email = localStorage.getItem(CURRENT_USER_EMAIL_KEY);
            if (!email) return null;
            const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
            return users[email] || null;
        }

        function saveUser(user) {
            const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
            users[user.email] = user;
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
        }

        function showToast(message) {
            const t = document.getElementById('toast');
            t.textContent = message;
            t.className = 'toast show';
            setTimeout(() => t.className = 'toast', 3000);
        }

        function showComingSoon() {
            showToast('🚀 Coming soon! Check back tomorrow.');
        }

        // ✅ Critical: Adsterra Smartlink Integration
        function watchAds() {
            if (!currentUser) {
                showToast('❌ Please log in first');
                setTimeout(() => window.location.href = 'login.html', 1500);
                return;
            }

            // Your working Smartlink (from earlier)
            const smartlink = "https://www.effectivegatecpm.com/hczkwk02?key=17ecf1ffc119105d7b10130dbe82c538";

            showToast('✅ Ad loading... Watch to earn ₦30!');

            // Open in new tab (best for Smartlink)
            const win = window.open(smartlink, '_blank');
            
            if (win) {
                // Simulate earning after 10 seconds (in real app, use Adsterra callback or post-message)
                setTimeout(() => {
                    // Add earnings
                    currentUser.balance = (currentUser.balance || 0) + 30;
                    currentUser.completedTasks = (currentUser.completedTasks || 0) + 1;
                    currentUser.transactions = currentUser.transactions || [];
                    currentUser.transactions.push({
                        id: 'tx_' + Date.now(),
                        type: 'credit',
                        amount: 30,
                        description: 'Watched ad',
                        date: new Date().toISOString()
                    });
                    saveUser(currentUser);

                    // Update balance
                    document.getElementById('balance').textContent = '₦' + currentUser.balance.toLocaleString();

                    showToast('🎉 ₦30 added to your wallet!');
                }, 10000); // 10 seconds delay (ad view time)
            } else {
                alert('Pop-up blocked! Please allow pop-ups and try again.');
            }
        }

        function init() {
            currentUser = getCurrentUser();
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            // Update UI
            document.getElementById('user-initial').textContent = currentUser.name.charAt(0).toUpperCase();
            document.getElementById('balance').textContent = '₦' + (currentUser.balance || 0).toLocaleString();

            // Attach click
            document.getElementById('watchAdsBtn').onclick = watchAds;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
