<!-- Updated earn.html with Adsterra integrated -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earnings Dashboard</title>

    <!-- Adsterra Head Script (already included in your original file) -->
    <script
      type="text/javascript"
      src="//stinkymildred.com/c3/15/09/c31509f61d04a6fd175c2b8485eac857.js"
    ></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: #f4f6f9;
        padding: 20px;
      }

      .header {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      .main-card, .wallet-section, .tasks-section {
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }

      .earn-text {
        font-size: 18px;
        margin-bottom: 10px;
        color: #444;
      }

      .earnings-amount {
        font-size: 32px;
        font-weight: 700;
        color: #27ae60;
      }

      .task-card {
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
        margin-bottom: 15px;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #3498db;
        border: none;
        color: #fff;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 12px;
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .bottom-ad {
        margin: 30px 0;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <h2 class="header">Earnings Dashboard 💰</h2>

    <div class="main-card">
      <p class="earn-text">Total Earnings:</p>
      <p id="earnings" class="earnings-amount">₦0.00</p>
    </div>

    <div class="wallet-section">
      <h3>Wallet Balance</h3>
      <p id="wallet" style="font-size: 22px; font-weight: bold">₦0.00</p>
    </div>

    <div class="tasks-section">
      <h3>Available Tasks</h3>

      <div class="task-card">
        <h4>Watch Ads</h4>
        <p>Earn ₦15 after 30 seconds of ad view</p>

        <!-- Inline Adsterra Script Ad Placement -->
        <div class="my-4 text-center">
          <script
            type="text/javascript"
            src="//stinkymildred.com/c3/15/09/c31509f61d04a6fd175c2b8485eac857.js"
          ></script>
        </div>

        <button id="watchAdBtn">Watch Ad Now</button>
      </div>
    </div>

    <!-- Bottom Adsterra Banner -->
    <div class="bottom-ad">
      <script
        type="text/javascript"
        src="//stinkymildred.com/c3/15/09/c31509f61d04a6fd175c2b8485eac857.js"
      ></script>
    </div>

    <script>
      const earningsDisplay = document.getElementById("earnings");
      const walletDisplay = document.getElementById("wallet");
      const watchAdBtn = document.getElementById("watchAdBtn");

      let earnings = parseFloat(localStorage.getItem("earnings")) || 0;
      let wallet = parseFloat(localStorage.getItem("wallet")) || 0;

      function updateDisplay() {
        earningsDisplay.textContent = `₦${earnings.toFixed(2)}`;
        walletDisplay.textContent = `₦${wallet.toFixed(2)}`;
      }

      updateDisplay();

      watchAdBtn.addEventListener("click", function () {
        watchAdBtn.disabled = true;
        watchAdBtn.textContent = "Watching Ad...";

        setTimeout(() => {
          earnings += 15;
          wallet += 15;
          localStorage.setItem("earnings", earnings);
          localStorage.setItem("wallet", wallet);

          updateDisplay();

          watchAdBtn.disabled = false;
          watchAdBtn.textContent = "Watch Ad Now";
          alert("Ad watched successfully! You've earned ₦15.");
        }, 30000);
      });
    </script>
  </body>
</html>
