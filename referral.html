<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referrals - TapWealth</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@700&family=SF+Pro+Text:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            color: #1e293b;
            padding-bottom: 70px; /* ✅ Push content above bottom nav */
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .facebook-blue {
            background-color: #1877F2;
        }
        .facebook-dark {
            background-color: #1C1E21;
        }
        .facebook-light {
            background-color: #f0f2f5;
        }
        .facebook-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .facebook-header {
            background-color: white;
            border-bottom: 1px solid #dddfe2;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .facebook-main-content {
            margin-left: 0; /* ✅ Removed sidebar margin */
            padding: 20px;
        }
        @media (max-width: 768px) {
            .facebook-main-content {
                padding: 12px;
            }
        }

        /* ✅ Bottom Nav Styles (copied from earn.html) */
        .pay-app-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #94a3b8;
        }
        .nav-item.active {
            color: #1d4ed8;
        }
        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body class="facebook-light min-h-screen">
    <!-- Facebook Header -->
    <header class="facebook-header">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-14 items-center">
                <div class="flex items-center">
                    <button class="text-gray-600" onclick="history.back()">
                        <i class="fas fa-arrow-left text-xl mr-4"></i>
                    </button>
                    <div class="flex-shrink-0 flex items-center">
                        <i class="fas fa-dollar-sign text-white text-xl mr-2" style="background: linear-gradient(135deg, #1877F2 0%, #C0C0C0 50%, #FFFFFF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;"></i>
                        <span class="text-xl font-bold" style="background: linear-gradient(135deg, #1877F2 0%, #C0C0C0 50%, #FFFFFF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">TapWealth</span>
                    </div>
                </div>
                <!-- 🚫 No 3-bar menu -->
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="facebook-main-content">
        <div class="max-w-4xl mx-auto">
            <!-- Header -->
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Referrals</h1>
                <p class="text-gray-600">Earn money by inviting friends to TapWealth</p>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="facebook-card p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-600 text-sm">Your Referrals</p>
                            <p class="text-2xl font-bold text-gray-800" id="total-referrals">0</p>
                        </div>
                        <i class="fas fa-users text-blue-600 text-2xl"></i>
                    </div>
                </div>
                
                <div class="facebook-card p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-600 text-sm">Referral Bonus</p>
                            <p class="text-2xl font-bold text-gray-800" id="referral-bonus">₦0</p>
                        </div>
                        <i class="fas fa-gift text-green-600 text-2xl"></i>
                    </div>
                </div>
                
                <div class="facebook-card p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-600 text-sm">Lifetime Earnings</p>
                            <p class="text-2xl font-bold text-gray-800" id="lifetime-earnings">₦0</p>
                        </div>
                        <i class="fas fa-chart-line text-purple-600 text-2xl"></i>
                    </div>
                </div>
            </div>

            <!-- Share Link -->
            <div class="facebook-card p-6 mb-8">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Share Your Referral Link</h2>
                <div class="flex items-center mb-4">
                    <input type="text" id="referral-link" readonly class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" value="Loading...">
                    <button onclick="copyLink()" class="ml-2 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Copy</button>
                </div>
                <button onclick="shareViaWhatsApp()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold">
                    <i class="fab fa-whatsapp mr-2"></i> Share on WhatsApp
                </button>
            </div>

            <!-- How It Works -->
            <div class="facebook-card p-6">
                <h3 class="font-bold mb-3">How It Works</h3>
                <ol class="list-decimal pl-5 space-y-2 text-sm text-gray-700">
                    <li>Share your link with friends</li>
                    <li>They sign up & complete 1 task</li>
                    <li>You get ₦100 instantly!</li>
                </ol>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="pay-app-nav">
        <a href="dashboard.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="earn.html" class="nav-item">
            <i class="fas fa-coins"></i>
            <span>Earn</span>
        </a>
        <a href="referral.html" class="nav-item active">
            <i class="fas fa-users"></i>
            <span>Refer</span>
        </a>
        <a href="shop.html" class="nav-item">
            <i class="fas fa-shopping-bag"></i>
            <span>Shop</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Me</span>
        </a>
    </div>

    <!-- Scripts -->
    <script src="/assets/script.js"></script>
    <script>
        const USERS_KEY = 'tapwealth_users';
        const CURRENT_USER_EMAIL_KEY = 'tapwealth_current_user_email';

        function getCurrentUser() {
            const email = localStorage.getItem(CURRENT_USER_EMAIL_KEY);
            if (!email) return null;
            const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
            return users[email] || null;
        }

        function saveUser(user) {
            const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
            users[user.email] = user;
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
        }

        function showToast(message) {
            let t = document.getElementById('toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'toast';
                t.className = 'fixed top-16 left-1/2 transform -translate-x-1/2 bg-green-600 text-white px-4 py-2 rounded-lg z-50';
                document.body.appendChild(t);
            }
            t.textContent = message;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2500);
        }

        function copyLink() {
            const input = document.getElementById('referral-link');
            input.select();
            document.execCommand('copy');
            showToast('✅ Link copied!');
        }

        function shareViaWhatsApp() {
            const link = document.getElementById('referral-link').value;
            const msg = `Hey! Join Tapwealth and earn real money — I’ll get ₦100 when you sign up 👇\n\n${link}`;
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }

        function trackReferral() {
            const urlParams = new URLSearchParams(window.location.search);
            const ref = urlParams.get('ref');
            if (ref) {
                const user = getCurrentUser();
                if (user && user.email !== ref) {
                    const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
                    if (users[ref]) {
                        users[ref].balance = (users[ref].balance || 0) + 100;
                        users[ref].referrals = (users[ref].referrals || 0) + 1;
                        localStorage.setItem(USERS_KEY, JSON.stringify(users));
                        user.referrer = ref;
                        saveUser(user);
                        showToast(`✅ You’ve been referred by ${ref}!`);
                    }
                }
            }
        }

        function updateUI() {
            const user = getCurrentUser();
            if (!user) {
                alert('🔒 Please log in first.');
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('total-referrals').textContent = user.referrals || 0;
            document.getElementById('referral-bonus').textContent = '₦' + ((user.referrals || 0) * 100).toLocaleString();
            document.getElementById('lifetime-earnings').textContent = '₦' + (user.balance || 0).toLocaleString();

            const refLink = `https://yourusername.github.io/tapwealth?ref=${user.id || 'ceo001'}`;
            document.getElementById('referral-link').value = refLink;
        }

        document.addEventListener('DOMContentLoaded', function() {
            trackReferral();
            updateUI();
        });
    </script>
</body>
</html>
