<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TapWealth</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@700&family=SF+Pro+Text:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ... your existing CSS ... */
    </style>
</head>
<body class="facebook-light min-h-screen">
    <!-- ... your header, mobile menu, sidebar, and main content ... -->
    
    <!-- Main Content -->
    <div class="facebook-main-content">
        <div class="max-w-4xl mx-auto">
            <!-- Welcome Banner -->
            <div class="facebook-post">
                <div class="flex items-center mb-4">
                    <div class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold mr-3" id="post-user-avatar">U</div>
                    <div>
                        <h2 class="font-bold text-gray-800" id="welcome-user-name">Welcome, User!</h2>
                        <p class="text-sm text-gray-500">Ready to earn more money today?</p>
                    </div>
                </div>
                <p class="text-gray-700 mb-4">
                    TapWealth is your gateway to financial freedom. Complete tasks, refer friends, and earn real money!
                </p>
                <div class="flex gap-2">
                    <button class="facebook-button" onclick="window.location.href='earn.html'">
                        <i class="fas fa-coins mr-2"></i> Start Earning
                    </button>
                    <button class="facebook-button secondary" onclick="window.location.href='referral.html'">
                        <i class="fas fa-users mr-2"></i> Invite Friends
                    </button>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                <!-- ... your stat cards ... -->
            </div>

            <!-- Recent Activity -->
            <div class="facebook-post">
                <h3 class="font-bold text-gray-800 mb-4">Recent Activity</h3>
                <div class="space-y-4" id="activity-feed">
                    <!-- ... activity feed ... -->
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="facebook-post">
                <h3 class="font-bold text-gray-800 mb-4">Quick Actions</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <button class="flex flex-col items-center p-4 rounded-lg hover:bg-gray-100" onclick="window.location.href='earn.html'">
                        <i class="fas fa-coins text-blue-600 text-2xl mb-2"></i>
                        <span class="text-sm font-medium text-gray-800">Earn Money</span>
                    </button>
                    <button class="flex flex-col items-center p-4 rounded-lg hover:bg-gray-100" onclick="window.location.href='shop.html'">
                        <i class="fas fa-shopping-cart text-green-600 text-2xl mb-2"></i>
                        <span class="text-sm font-medium text-gray-800">Shopping</span>
                    </button>
                    <button class="flex flex-col items-center p-4 rounded-lg hover:bg-gray-100" onclick="window.location.href='referral.html'">
                        <i class="fas fa-users text-purple-600 text-2xl mb-2"></i>
                        <span class="text-sm font-medium text-gray-800">Referrals</span>
                    </button>
                    <button class="flex flex-col items-center p-4 rounded-lg hover:bg-gray-100" onclick="window.location.href='wallet.html'">
                        <i class="fas fa-wallet text-orange-600 text-2xl mb-2"></i>
                        <span class="text-sm font-medium text-gray-800">Wallet</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let sessionTimeout = null;
        
        // Toggle mobile menu
        function toggleMobileMenu() {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('hidden');
            if (!mobileMenu.classList.contains('hidden')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = 'auto';
            }
        }
        
        // Logout user
        function logoutUser() {
            localStorage.removeItem('tapwealth_current_user');
            alert('You have been logged out!');
            window.location.href = 'login.html';
        }
        
        // Session timeout (1 HOUR for testing)
        function startSessionTimeout() {
            if (sessionTimeout) {
                clearTimeout(sessionTimeout);
            }
            // ⬇️ Changed from 5 minutes (300000) to 1 hour (3600000)
            sessionTimeout = setTimeout(function() {
                logoutUser();
            }, 3600000); // 1 hour
        }
        
        // Update dashboard
        function updateDashboard() {
            if (!currentUser) return;
            
            document.getElementById('user-avatar').textContent = currentUser.name.charAt(0).toUpperCase();
            document.getElementById('user-name').textContent = currentUser.name.split(' ')[0];
            document.getElementById('mobile-user-avatar').textContent = currentUser.name.charAt(0).toUpperCase();
            document.getElementById('mobile-user-name').textContent = currentUser.name;
            document.getElementById('mobile-user-balance').textContent = currentUser.balance.toLocaleString();
            document.getElementById('post-user-avatar').textContent = currentUser.name.charAt(0).toUpperCase();
            document.getElementById('welcome-user-name').textContent = 'Welcome, ' + currentUser.name + '!';
            document.getElementById('balance-card').textContent = currentUser.balance.toLocaleString();
            document.getElementById('earnings-card').textContent = currentUser.balance.toLocaleString();
            document.getElementById('referral-card').textContent = currentUser.referrals || 0;
            document.getElementById('tasks-card').textContent = currentUser.completedTasks || 0;
            
            const activityFeed = document.getElementById('activity-feed');
            activityFeed.innerHTML = '';
            if (currentUser.transactions && currentUser.transactions.length > 0) {
                currentUser.transactions.slice().reverse().slice(0, 5).forEach(transaction => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center pb-4 border-b border-gray-200 last:border-0 last:pb-0';
                    div.innerHTML = `
                        <div>
                            <p class="font-medium text-gray-800">${transaction.description}</p>
                            <p class="text-sm text-gray-500">${new Date(transaction.date).toLocaleDateString()}</p>
                        </div>
                        <div class="font-bold ${transaction.type === 'credit' ? 'text-green-600' : 'text-red-600'}">
                            ${transaction.type === 'credit' ? '+' : '-'}₦${transaction.amount.toLocaleString()}
                        </div>
                    `;
                    activityFeed.appendChild(div);
                });
            } else {
                activityFeed.innerHTML = `
                    <div class="flex justify-between items-center pb-4 border-b border-gray-200 last:border-0 last:pb-0">
                        <div>
                            <p class="font-medium text-gray-800">Welcome Bonus</p>
                            <p class="text-sm text-gray-500">Account created</p>
                        </div>
                        <div class="font-bold text-green-600">+₦500.00</div>
                    </div>
                `;
            }
        }
        
        // Check authentication
        window.addEventListener('DOMContentLoaded', function() {
            const savedUser = localStorage.getItem('tapwealth_current_user');
            if (!savedUser) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = JSON.parse(savedUser);
            updateDashboard();
            startSessionTimeout(); // ⬅️ Only start timeout, no reset listeners
        });
    </script>
</body>
</html>
