<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TapWealth</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            margin: 0;
            padding: 0;
            color: #1e293b;
        }
        .header {
            background: white;
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .menu-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
        }
        .app-title {
            font-weight: 700;
            font-size: 18px;
            color: #0f172a;
        }
        .wallet-card {
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            color: white;
            border-radius: 16px;
            padding: 20px;
            margin: 16px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .pay-app-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #94a3b8;
        }
        .nav-item.active {
            color: #1d4ed8;
        }
        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }
        #admin-menu {
            position: fixed;
            top: 60px;
            right: 16px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            padding: 8px 0;
            z-index: 9999;
            min-width: 200px;
        }
        #admin-menu a {
            display: block;
            padding: 12px 16px;
            color: #3b82f6;
            font-weight: 600;
            text-decoration: none;
        }
        #admin-menu a:hover {
            background: #f8fafc;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <button class="menu-btn" id="menu-btn">
            <i class="fas fa-bars text-xl"></i>
        </button>
        <div class="app-title">TapWealth</div>
        <div class="w-12"></div> <!-- spacer -->
    </div>

    <!-- Wallet Card -->
    <div class="wallet-card">
        <div class="flex justify-between items-center">
            <div>
                <p class="opacity-80">Wallet Balance</p>
                <p class="text-2xl font-bold mt-1" id="balance">₦0.00</p>
            </div>
            <button class="bg-white px-4 py-2 rounded-full text-blue-600 font-medium shadow-sm" onclick="window.location.href='wallet.html'">
                Wallet <i class="fas fa-arrow-right ml-1"></i>
            </button>
        </div>
    </div>

    <!-- Recent Activity -->
    <div class="card">
        <h2 class="text-xl font-bold mb-4">Recent Activity</h2>
        <div id="activity-list">
            <div class="text-center py-8 text-gray-500">
                <i class="fas fa-inbox text-3xl mb-3"></i>
                <p>No recent activity</p>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="pay-app-nav">
        <a href="dashboard.html" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="earn.html" class="nav-item">
            <i class="fas fa-coins"></i>
            <span>Earn</span>
        </a>
        <a href="referral.html" class="nav-item">
            <i class="fas fa-users"></i>
            <span>Refer</span>
        </a>
        <a href="shop.html" class="nav-item">
            <i class="fas fa-shopping-bag"></i>
            <span>Shop</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Me</span>
        </a>
    </div>

    <script>
        const USERS_KEY = 'tapwealth_users';
        const CURRENT_USER_EMAIL_KEY = 'tapwealth_current_user_email';

        function getCurrentUser() {
            const email = localStorage.getItem(CURRENT_USER_EMAIL_KEY);
            if (!email) return null;
            const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
            return users[email] || null;
        }

        function updateUI() {
            const user = getCurrentUser();
            if (!user) {
                alert('🔒 Please log in.');
                window.location.href = 'login.html';
                return;
            }

            // Update balance
            document.getElementById('balance').textContent = '₦' + (user.balance || 0).toLocaleString();

            // Update activity
            const list = document.getElementById('activity-list');
            if (user.transactions && user.transactions.length > 0) {
                list.innerHTML = user.transactions.slice().reverse().map(tx => `
                    <div class="flex justify-between items-center py-3 border-b border-gray-200 last:border-0">
                        <span>${tx.description}</span>
                        <span class="${tx.type === 'credit' ? 'text-green-600' : 'text-red-600'} font-medium">
                            ${tx.type === 'credit' ? '+' : '-'}₦${tx.amount}
                        </span>
                    </div>
                `).join('');
            }
        }

        // Admin Menu
        document.getElementById('menu-btn').addEventListener('click', function(e) {
            e.stopPropagation();

            const user = getCurrentUser();
            if (!user || user.email !== 'wealthysilvar@gmail.com') {
                alert('🚫 Admin access only');
                return;
            }

            // Toggle menu
            const menu = document.getElementById('admin-menu');
            if (menu) {
                menu.remove();
                return;
            }

            const el = document.createElement('div');
            el.id = 'admin-menu';
            el.innerHTML = `
                <a href="admin.html">🚀 Admin Dashboard</a>
            `;
            document.body.appendChild(el);

            // Close on outside click
            setTimeout(() => {
                document.addEventListener('click', function close(e) {
                    if (!el.contains(e.target) && e.target.id !== 'menu-btn') {
                        el.remove();
                        document.removeEventListener('click', close);
                    }
                });
            }, 100);
        });

        // Init
        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
