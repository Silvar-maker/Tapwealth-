<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TapWealth</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            margin: 0;
            padding: 0;
            color: #1e293b;
        }
        .pay-app-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #94a3b8;
        }
        .nav-item.active {
            color: #1d4ed8;
        }
        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .header {
            background: white;
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
        }
        .menu-btn {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            color: #64748b;
        }
        .app-title {
            font-weight: 700;
            font-size: 18px;
            color: #0f172a;
        }
        .wallet-card {
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            color: white;
            border-radius: 16px;
            padding: 20px;
            margin: 16px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        .quick-action {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin: 12px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
        }
        .quick-action i {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-right: 12px;
        }
        .green-bg { background: #dcfce7; color: #16a34a; }
        .blue-bg { background: #dbeafe; color: #2563eb; }
        .purple-bg { background: #ede9fe; color: #7c3aed; }
        .orange-bg { background: #ffedd5; color: #ea580c; }
        .toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: #059669;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show {
            opacity: 1;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100%;
            background: white;
            box-shadow: 4px 0 12px rgba(0,0,0,0.1);
            z-index: 1001;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }
        .sidebar.open {
            transform: translateX(0);
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            display: none;
        }
        .overlay.open {
            display: block;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #f1f5f9;
        }
        .sidebar-item {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            color: #475569;
            text-decoration: none;
        }
        .sidebar-item:hover {
            background: #f8fafc;
        }
        .sidebar-item i {
            width: 32px;
            text-align: center;
            font-size: 16px;
            margin-right: 12px;
        }
        .sidebar-footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 16px 20px;
            border-top: 1px solid #f1f5f9;
            background: white;
        }
    </style>
</head>
<body>
    <!-- Sidebar Overlay -->
    <div class="overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- Sidebar Menu -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="flex items-center">
                <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold mr-3" id="sidebar-avatar">U</div>
                <div>
                    <p class="font-bold" id="sidebar-name">User</p>
                    <p class="text-sm text-gray-500" id="sidebar-balance">₦0.00</p>
                </div>
            </div>
        </div>

        <a href="dashboard.html" class="sidebar-item active">
            <i class="fas fa-home"></i>
            <span>Dashboard</span>
        </a>
        <a href="earn.html" class="sidebar-item">
            <i class="fas fa-coins"></i>
            <span>Earn Money</span>
        </a>
        <a href="referral.html" class="sidebar-item">
            <i class="fas fa-users"></i>
            <span>Referrals</span>
        </a>
        <a href="shop.html" class="sidebar-item">
            <i class="fas fa-shopping-bag"></i>
            <span>Shopping</span>
        </a>
        <a href="settings.html" class="sidebar-item">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
        </a>

        <div class="sidebar-footer">
            <a href="javascript:logoutUser()" class="sidebar-item text-red-600">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <button class="text-gray-600" onclick="showAdminMenu()">
    <i class="fas fa-bars text-xl"></i>
</button>
        <div class="app-title">TapWealth</div>
    </div>

    <!-- Wallet Card (Top) -->
    <div class="wallet-card">
        <div class="flex justify-between items-center">
            <div>
                <p class="opacity-80">Wallet Balance</p>
                <p class="text-2xl font-bold mt-1" id="balance">₦0.00</p>
            </div>
            <button class="bg-blue-50 backdrop-blur-sm px-4 py-2 rounded-full text-white font-medium" onclick="window.location.href='wallet.html'">
    Wallet <i class="fas fa-arrow-right ml-1"></i>
</button>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-action" onclick="navigateTo('earn.html')">
        <div class="blue-bg"><i class="fas fa-tv"></i></div>
        <div>
            <p class="font-bold">Watch Ads</p>
            <p class="text-sm text-gray-500">Earn ₦10–₦50 per ad</p>
        </div>
    </div>

    <div class="quick-action" onclick="navigateTo('referral.html')">
        <div class="green-bg"><i class="fas fa-share-alt"></i></div>
        <div>
            <p class="font-bold">Invite Friends</p>
            <p class="text-sm text-gray-500">Get ₦500 per referral</p>
        </div>
    </div>

    <div class="quick-action" onclick="navigateTo('shop.html')">
        <div class="purple-bg"><i class="fas fa-shopping-cart"></i></div>
        <div>
            <p class="font-bold">Shop & Earn</p>
            <p class="text-sm text-gray-500">Cashback on every purchase</p>
        </div>
    </div>

    <!-- Recent Activity -->
<div class="facebook-card p-6 mb-8">
    <h2 class="text-xl font-bold text-gray-800 mb-4">Recent Activity</h2>
    <div class="space-y-4" id="activity-list">
        <!-- Will be filled by JS -->
    </div>
</div>

    <!-- Bottom Nav -->
    <div class="pay-app-nav">
        <a href="dashboard.html" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="earn.html" class="nav-item">
            <i class="fas fa-coins"></i>
            <span>Earn</span>
        </a>
        <a href="referral.html" class="nav-item">
            <i class="fas fa-users"></i>
            <span>Refer</span>
        </a>
        <a href="shop.html" class="nav-item">
            <i class="fas fa-shopping-bag"></i>
            <span>Shop</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Me</span>
        </a>
    </div>

    <div class="toast" id="toast">Message</div>

    <script>
        const USERS_KEY = 'tapwealth_users';
        const CURRENT_USER_EMAIL_KEY = 'tapwealth_current_user_email';
        let currentUser = null;

        // Sidebar
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('open');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebar-overlay').classList.remove('open');
        }

        // Navigation
        function navigateTo(page) {
            closeSidebar();
            window.location.href = page;
        }

        // Get user
        function getCurrentUser() {
            const email = localStorage.getItem(CURRENT_USER_EMAIL_KEY);
            if (!email) return null;
            const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
            return users[email] || null;
        }

        // Save user
        function saveUser(user) {
            const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
            users[user.email] = user;
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
        }

        // Logout
        function logoutUser() {
            localStorage.removeItem(CURRENT_USER_EMAIL_KEY);
            alert('✅ Logged out!');
            window.location.href = 'login.html';
        }

        // Toast
        function showToast(message) {
            const t = document.getElementById('toast');
            t.textContent = message;
            t.className = 'toast show';
            setTimeout(() => t.className = 'toast', 3000);
        }

        // Update dashboard
        function updateDashboard() {
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            const initial = currentUser.name.charAt(0).toUpperCase();
            document.getElementById('sidebar-avatar').textContent = initial;
            document.getElementById('sidebar-name').textContent = currentUser.name;
            document.getElementById('sidebar-balance').textContent = '₦' + (currentUser.balance || 0).toLocaleString();
            document.getElementById('balance').textContent = '₦' + (currentUser.balance || 0).toLocaleString();

            // Recent Activity
const activityList = document.getElementById('activity-list');
activityList.innerHTML = '';

if (currentUser.transactions && currentUser.transactions.length > 0) {
    // Show all transactions, newest first
    currentUser.transactions.slice().reverse().forEach(transaction => {
        const div = document.createElement('div');
        div.className = 'flex justify-between items-center pb-4 border-b border-gray-200 dark:border-slate-700 last:border-0 last:pb-0';
        div.innerHTML = `
            <div>
                <p class="font-medium text-gray-800 dark:text-white">${transaction.description}</p>
                <p class="text-sm text-gray-500 dark:text-gray-400">${new Date(transaction.date).toLocaleDateString()}</p>
            </div>
            <div class="font-bold ${transaction.type === 'credit' ? 'text-green-600' : 'text-red-600'}">
                ${transaction.type === 'credit' ? '+' : '-'}₦${transaction.amount.toLocaleString()}
            </div>
        `;
        activityList.appendChild(div);
    });
} else {
    activityList.innerHTML = `
        <div class="text-center py-8 text-gray-500">
            <i class="fas fa-inbox text-3xl mb-3"></i>
            <p>No recent activity</p>
        </div>
    `;
}
        // Init
        document.addEventListener('DOMContentLoaded', function() {
            currentUser = getCurrentUser();
            updateDashboard();

            // Close sidebar on back
            window.addEventListener('popstate', closeSidebar);
        });
            function showAdminMenu() {
    const user = getCurrentUser();
    if (!user) {
        alert('🔒 Please log in first.');
        window.location.href = 'login.html';
        return;
    }

    // ✅ Only show Admin link if CEO email
    if (user.email === 'wealthysilvar@gmail.com') {
        const adminLink = document.createElement('a');
        adminLink.href = 'admin.html';
        adminLink.textContent = '🚀 Admin Dashboard';
        adminLink.className = 'block px-4 py-2 text-blue-600 hover:bg-blue-50 rounded-md';

        const menu = document.createElement('div');
        menu.className = 'absolute top-12 right-0 bg-white border border-gray-200 rounded-lg shadow-lg z-50';
        menu.appendChild(adminLink);

        document.body.appendChild(menu);

        // Close on click outside
        document.addEventListener('click', function close(e) {
            if (!menu.contains(e.target)) {
                menu.remove();
                document.removeEventListener('click', close);
            }
        });
    } else {
        alert('🚫 Access denied. Admin only.');
    }
}
    </script> 
</body>
</html>
