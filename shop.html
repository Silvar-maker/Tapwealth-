<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping - TapWealth</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@700&family=SF+Pro+Text:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            color: #1e293b;
            padding-bottom: 70px; /* ✅ Prevent nav cover */
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .facebook-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .facebook-header {
            background-color: white;
            border-bottom: 1px solid #dddfe2;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .facebook-main-content {
            margin-left: 0; /* ✅ Full width — no sidebar */
            padding: 20px;
        }
        @media (max-width: 768px) {
            .facebook-main-content {
                padding: 12px;
            }
        }

        /* ✅ Bottom Nav (exactly like earn.html) */
        .pay-app-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #94a3b8;
        }
        .nav-item.active {
            color: #1d4ed8;
        }
        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body class="facebook-light min-h-screen">
    <!-- Facebook Header -->
    <header class="facebook-header">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-14 items-center">
                <div class="flex items-center">
                    <button class="text-gray-600" onclick="history.back()">
                        <i class="fas fa-arrow-left text-xl mr-4"></i>
                    </button>
                    <div class="flex-shrink-0 flex items-center">
                        <i class="fas fa-dollar-sign text-white text-xl mr-2" style="background: linear-gradient(135deg, #1877F2 0%, #C0C0C0 50%, #FFFFFF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;"></i>
                        <span class="text-xl font-bold" style="background: linear-gradient(135deg, #1877F2 0%, #C0C0C0 50%, #FFFFFF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">TapWealth</span>
                    </div>
                </div>
                <!-- 🚫 No 3-bar menu -->
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="facebook-main-content">
        <div class="max-w-4xl mx-auto">
            <!-- Header -->
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Shop & Earn</h1>
                <p class="text-gray-600">Get cashback on every purchase</p>
            </div>

            <!-- Stores -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                <div class="facebook-card p-6">
                    <div class="flex items-start">
                        <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center mr-3">
                            <i class="fas fa-tv text-red-600"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold">AliExpress</h3>
                            <p class="text-sm text-gray-600 mt-1">Electronics, fashion, home</p>
                        </div>
                    </div>
                    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold" onclick="goToStore('AliExpress')">Go →</button>
                </div>

                <div class="facebook-card p-6">
                    <div class="flex items-start">
                        <div class="w-10 h-10 rounded-full bg-yellow-100 flex items-center justify-center mr-3">
                            <i class="fas fa-mobile-alt text-yellow-600"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold">Jumia</h3>
                            <p class="text-sm text-gray-600 mt-1">Phones, appliances, groceries</p>
                        </div>
                    </div>
                    <button class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-bold" onclick="goToStore('Jumia')">Go →</button>
                </div>

                <div class="facebook-card p-6">
                    <div class="flex items-start">
                        <div class="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center mr-3">
                            <i class="fas fa-gift text-purple-600"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold">Temu</h3>
                            <p class="text-sm text-gray-600 mt-1">Trending items, low prices</p>
                        </div>
                    </div>
                    <button class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-lg font-bold" onclick="goToStore('Temu')">Go →</button>
                </div>
            </div>

            <!-- How It Works -->
            <div class="facebook-card p-6">
                <h3 class="font-bold mb-3">How Cashback Works</h3>
                <ol class="text-sm mt-2 space-y-2 text-gray-700">
                    <li>Click a store above</li>
                    <li>Shop as usual</li>
                    <li>Cashback appears in wallet in 3–7 days</li>
                </ol>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="pay-app-nav">
        <a href="dashboard.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="earn.html" class="nav-item">
            <i class="fas fa-coins"></i>
            <span>Earn</span>
        </a>
        <a href="referral.html" class="nav-item">
            <i class="fas fa-users"></i>
            <span>Refer</span>
        </a>
        <a href="shop.html" class="nav-item active">
            <i class="fas fa-shopping-bag"></i>
            <span>Shop</span>
        </a>
        <a href="settings.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Me</span>
        </a>
    </div>

    <!-- Scripts -->
    <script src="/assets/script.js"></script>
    <script>
        const USERS_KEY = 'tapwealth_users';
        const CURRENT_USER_EMAIL_KEY = 'tapwealth_current_user_email';

        function getCurrentUser() {
            const email = localStorage.getItem(CURRENT_USER_EMAIL_KEY);
            if (!email) return null;
            const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
            return users[email] || null;
        }

        function saveUser(user) {
            const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
            users[user.email] = user;
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
        }

        function showToast(message) {
            let t = document.getElementById('toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'toast';
                t.className = 'fixed top-16 left-1/2 transform -translate-x-1/2 bg-green-600 text-white px-4 py-2 rounded-lg z-50';
                document.body.appendChild(t);
            }
            t.textContent = message;
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2500);
        }

        function goToStore(store) {
            const user = getCurrentUser();
            if (!user) {
                alert('Please log in first.');
                window.location.href = 'login.html';
                return;
            }

            // Simulate cashback
            const cashbackAmount = Math.floor(Math.random() * 50) + 10;
            user.transactions = user.transactions || [];
            user.transactions.push({
                id: Date.now(),
                type: 'credit',
                description: `Cashback from ${store}`,
                amount: cashbackAmount,
                date: new Date().toISOString()
            });
            saveUser(user);

            // Replace with your real affiliate links later
            let url = 'https://google.com';
            if (store === 'AliExpress') url = 'https://click.aliexpress.com/xxxx';
            else if (store === 'Jumia') url = 'https://www.jumia.com.ng/?aff_id=xxxx';
            else if (store === 'Temu') url = 'https://temu.to/k/xxxx';

            showToast(`🚀 Opening ${store}...`);
            setTimeout(() => window.open(url, '_blank'), 800);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
        });
    </script>
</body>
</html>
