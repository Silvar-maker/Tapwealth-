<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - TapWealth</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; margin: 0; padding: 0; color: #1e293b; }
        .header { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: white; padding: 16px; display: flex; align-items: center; justify-content: space-between; }
        .app-title { font-weight: 700; font-size: 18px; }
        .card { background: white; border-radius: 16px; padding: 20px; margin: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-grid { display: grid; grid-cols-repeat: 2, minmax(0, 1fr); gap: 16px; }
        .stat-card { background: linear-gradient(135deg, #dbeafe, #bfdbfe); border-radius: 12px; padding: 16px; text-align: center; }
        .stat-number { font-size: 24px; font-weight: bold; color: #1d4ed8; }
        .stat-label { font-size: 12px; color: #64748b; margin-top: 4px; }
        .tab { padding: 8px 16px; border: 1px solid #e2e8f0; border-radius: 8px; background: white; cursor: pointer; margin: 4px; font-weight: 500; }
        .tab.active { background: #1d4ed8; color: white; border-color: #1d4ed8; }
        .table { width: 100%; border-collapse: collapse; }
        .table th { background: #f1f5f9; padding: 12px; text-align: left; font-weight: 600; border-bottom: 1px solid #e2e8f0; }
        .table td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        .table tr:hover { background: #f8fafc; }
        .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
        .btn-primary { background: #1d4ed8; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 14px; color: #333; margin-bottom: 6px; font-weight: 500; }
        .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box; }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="app-title">🚀 Admin Dashboard</div>
        <button onclick="logoutAdmin()" class="btn btn-danger" style="padding: 8px 16px;">
            <i class="fas fa-sign-out-alt mr-1"></i> Logout
        </button>
    </div>

    <!-- Main Content -->
    <div style="padding-bottom: 20px;">
        <!-- Stats -->
        <div class="card">
            <div class="stat-grid">
                <div class="stat-card">
                    <p class="stat-label">👥 Total Users</p>
                    <p class="stat-number" id="stat-users">0</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">💰 Total Balance</p>
                    <p class="stat-number" id="stat-balance">₦0</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">📈 Total Earnings</p>
                    <p class="stat-number" id="stat-earnings">₦0</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">📊 Active Users</p>
                    <p class="stat-number" id="stat-active">0</p>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="card">
            <div class="flex justify-center flex-wrap">
                <button onclick="switchAdminTab('overview')" class="tab active" id="tab-overview">📊 Overview</button>
                <button onclick="switchAdminTab('users')" class="tab" id="tab-users">👥 Users</button>
                <button onclick="switchAdminTab('settings')" class="tab" id="tab-settings">⚙️ Settings</button>
            </div>
        </div>

        <!-- Overview Tab -->
        <div id="overview-tab" class="card">
            <h2 class="text-lg font-bold text-gray-800 mb-4">📈 Platform Statistics</h2>
            <div class="space-y-4">
                <div class="flex justify-between items-center p-4 bg-blue-50 rounded-lg">
                    <span class="text-gray-700">Total Transactions</span>
                    <span class="font-bold text-blue-600" id="total-txs">0</span>
                </div>
                <div class="flex justify-between items-center p-4 bg-green-50 rounded-lg">
                    <span class="text-gray-700">Total Earned by Users</span>
                    <span class="font-bold text-green-600" id="total-earned">₦0</span>
                </div>
                <div class="flex justify-between items-center p-4 bg-purple-50 rounded-lg">
                    <span class="text-gray-700">Total Withdrawn</span>
                    <span class="font-bold text-purple-600" id="total-withdrawn">₦0</span>
                </div>
            </div>
        </div>

        <!-- Users Tab -->
        <div id="users-tab" class="card" style="display: none;">
            <h2 class="text-lg font-bold text-gray-800 mb-4">👥 Manage Users</h2>
            <div style="overflow-x: auto;">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Balance</th>
                            <th>Tasks</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="users-table">
                        <tr>
                            <td colspan="5" class="text-center text-gray-500">Loading users...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Settings Tab -->
        <div id="settings-tab" class="card" style="display: none;">
            <h2 class="text-lg font-bold text-gray-800 mb-4">⚙️ Platform Settings</h2>
            <div class="input-group">
                <label>Ad Reward (₦)</label>
                <input type="number" id="ad-rate" value="15" min="5" max="100" />
            </div>
            <div class="input-group">
                <label>Referral Bonus (₦)</label>
                <input type="number" id="referral-bonus" value="100" min="50" max="500" />
            </div>
            <div class="input-group">
                <label>Welcome Bonus (₦)</label>
                <input type="number" id="welcome-bonus" value="500" min="100" max="2000" />
            </div>
            <button onclick="saveAdminSettings()" class="btn btn-primary" style="width: 100%; margin-top: 16px;">
                <i class="fas fa-save mr-2"></i> Save Settings
            </button>
        </div>
    </div>

    <script>
        const USERS_KEY = 'tapwealth_users';
        const CURRENT_USER_EMAIL_KEY = 'tapwealth_current_user_email';
        const ADMIN_EMAIL = 'wealthysilvar@gmail.com';
        let currentAdminTab = 'overview';

        function checkAdminAccess() {
            const email = localStorage.getItem(CURRENT_USER_EMAIL_KEY);
            if (email !== ADMIN_EMAIL) {
                alert('🚫 Access Denied! Admin only.');
                window.location.href = './dashboard.html';
                return false;
            }
            return true;
        }

        function switchAdminTab(tab) {
            currentAdminTab = tab;
            document.querySelectorAll('[id$="-tab"]').forEach(el => el.style.display = 'none');
            document.getElementById(tab + '-tab').style.display = 'block';
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            if (tab === 'users') renderUsers();
        }

        function renderUsers() {
            const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
            const tbody = document.getElementById('users-table');

            if (Object.keys(users).length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-gray-500">No users yet</td></tr>';
                return;
            }

            tbody.innerHTML = Object.values(users).map(user => `
                <tr>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>₦${(user.balance || 0).toLocaleString('en-NG')}</td>
                    <td>${user.completedTasks || 0}</td>
                    <td>
                        <button onclick="banUser('${user.email}')" class="btn btn-danger" style="padding: 6px 12px; font-size: 12px;">Ban</button>
                    </td>
                </tr>
            `).join('');
        }

        function banUser(email) {
            if (confirm(`Ban ${email}?`)) {
                const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
                delete users[email];
                localStorage.setItem(USERS_KEY, JSON.stringify(users));
                renderUsers();
                updateAdminStats();
                alert('✅ User banned successfully');
            }
        }

        function updateAdminStats() {
            const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
            const userArray = Object.values(users);

            let totalBalance = 0;
            let totalEarned = 0;
            let totalWithdrawn = 0;
            let totalTxs = 0;
            let activeUsers = 0;

            userArray.forEach(user => {
                totalBalance += user.balance || 0;
                const txs = user.transactions || [];
                totalTxs += txs.length;
                txs.forEach(tx => {
                    if (tx.type === 'credit') totalEarned += tx.amount;
                    else totalWithdrawn += tx.amount;
                });
                if (user.lastActive && Date.now() - user.lastActive < 86400000) activeUsers++;
            });

            document.getElementById('stat-users').textContent = userArray.length;
            document.getElementById('stat-balance').textContent = '₦' + totalBalance.toLocaleString('en-NG');
            document.getElementById('stat-earnings').textContent = '₦' + totalEarned.toLocaleString('en-NG');
            document.getElementById('stat-active').textContent = activeUsers;
            document.getElementById('total-txs').textContent = totalTxs;
            document.getElementById('total-earned').textContent = '₦' + totalEarned.toLocaleString('en-NG');
            document.getElementById('total-withdrawn').textContent = '₦' + totalWithdrawn.toLocaleString('en-NG');
        }

        function saveAdminSettings() {
            const settings = {
                adRate: parseFloat(document.getElementById('ad-rate').value),
                referralBonus: parseFloat(document.getElementById('referral-bonus').value),
                welcomeBonus: parseFloat(document.getElementById('welcome-bonus').value)
            };
            localStorage.setItem('tapwealth_admin_settings', JSON.stringify(settings));
            alert('✅ Settings saved successfully!');
        }

        function logoutAdmin() {
            if (confirm('Logout from admin?')) {
                localStorage.removeItem(CURRENT_USER_EMAIL_KEY);
                window.location.href = './login.html';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (checkAdminAccess()) {
                updateAdminStats();
            }
        });
    </script>
</body>
</html>
