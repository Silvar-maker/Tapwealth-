<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ... your existing <head> (unchanged) ... -->
</head>
<body class="facebook-light min-h-screen">
    <!-- ... header, mobile menu, sidebar, main content (HTML unchanged) ... -->

    <!-- ✅ FIXED: Unified user management (matches all other pages) -->
    <script>
        // ===== CONFIG (shared) =====
        const CONFIG = {
            get adRate() { return parseFloat(localStorage.getItem('tapwealth_ad_rate') || 30); },
            get referralBonus() { return parseFloat(localStorage.getItem('tapwealth_referral_bonus') || 100); }
        };
        function saveConfig() {
            localStorage.setItem('tapwealth_ad_rate', document.getElementById('ads-rate')?.value || 30);
            localStorage.setItem('tapwealth_referral_bonus', document.getElementById('referral-rate')?.value || 100);
        }

        const USERS_KEY = 'tapwealth_users';
        const CURRENT_USER_EMAIL_KEY = 'tapwealth_current_user_email';

        // ✅ Unified user functions — DO NOT duplicate
        function getCurrentUser() {
            const email = localStorage.getItem(CURRENT_USER_EMAIL_KEY);
            if (!email) return null;
            const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
            return users[email] || null;
        }

        function saveUser(data) {
            const email = localStorage.getItem(CURRENT_USER_EMAIL_KEY);
            if (!email) return;
            const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
            users[email] = { ...users[email], ...data, lastActive: Date.now() };
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
        }

        // ✅ Unified updateUI (called on init + after withdrawal)
        function updateUI() {
            const user = getCurrentUser();
            if (!user) {
                alert('🔒 Session expired. Please log in again.');
                window.location.href = './login.html';
                return;
            }

            // Update balance
            const balanceEl = document.getElementById('balance-display');
            if (balanceEl) {
                balanceEl.textContent = '₦' + (user.balance || 0).toLocaleString();
                balanceEl.style.color = user.balance >= 0 ? '#10b981' : '#ef4444';
            }

            // Update stats
            document.getElementById('total-earnings')?.textContent = '₦' + (user.balance || 0).toLocaleString();
            document.getElementById('completed-tasks')?.textContent = user.completedTasks || 0;
            document.getElementById('referral-count')?.textContent = user.referrals || 0;
            document.getElementById('withdrawal-count')?.textContent = (user.withdrawals || 0);

            // Mobile menu
            document.getElementById('mobile-user-avatar')?.textContent = user.name.charAt(0).toUpperCase();
            document.getElementById('mobile-user-name')?.textContent = user.name;
            document.getElementById('mobile-user-balance')?.textContent = (user.balance || 0).toLocaleString();

            // Transactions
            renderTransactions(user.transactions || []);
            renderWithdrawals(user.transactions?.filter(t => t.type === 'debit') || []);
            renderPendingCashback();
        }

        function renderTransactions(transactions) {
            const el = document.getElementById('transaction-history');
            if (!el) return;
            el.innerHTML = transactions.slice().reverse().slice(0, 10).map(tx => `
                <div class="flex justify-between items-center pb-4 border-b border-gray-200">
                    <div>
                        <p class="font-medium text-gray-800">${tx.description}</p>
                        <p class="text-sm text-gray-500">${new Date(tx.date).toLocaleDateString()}</p>
                    </div>
                    <div class="font-bold ${tx.type === 'credit' ? 'text-green-600' : 'text-red-600'}">
                        ${tx.type === 'credit' ? '+' : '-'}₦${tx.amount.toLocaleString()}
                    </div>
                </div>
            `).join('') || `
                <div class="flex justify-between items-center pb-4 border-b border-gray-200">
                    <div>
                        <p class="font-medium text-gray-800">Welcome Bonus</p>
                        <p class="text-sm text-gray-500">Account created</p>
                    </div>
                    <div class="font-bold text-green-600">+₦500.00</div>
                </div>
            `;
        }

        function renderWithdrawals(withdrawals) {
            const el = document.getElementById('withdrawal-requests');
            if (!el) return;
            el.innerHTML = withdrawals.length ? `
                <div class="flex justify-between items-center p-4 bg-gray-50 rounded-lg">
                    <div>
                        <p class="font-medium text-gray-800">Withdrawal Request</p>
                        <p class="text-sm text-gray-500">₦${withdrawals.slice(-1)[0].amount.toLocaleString()} to Opay</p>
                    </div>
                    <div class="font-bold text-orange-600">Completed</div>
                </div>
            ` : `
                <div class="text-center py-8 text-gray-500">
                    <i class="fas fa-inbox text-3xl mb-3"></i>
                    <p>No withdrawal requests yet</p>
                </div>
            `;
        }

        function renderPendingCashback() {
            const el = document.getElementById('pending-cashback');
            if (!el) return;
            el.innerHTML = `
                <div class="text-center py-6 text-gray-500">
                    <i class="fas fa-coins text-2xl mb-2"></i>
                    <p>No pending cashback</p>
                    <p class="text-sm mt-1">Shop via TapWealth to earn rewards!</p>
                </div>
            `;
        }

        // ✅ FIXED: Single, robust withdrawal function
        function processWithdrawal() {
            const user = getCurrentUser();
            if (!user) return;

            const amount = parseFloat(document.getElementById('withdrawal-amount').value);
            const opayNumber = document.getElementById('account-details').value.trim();
            const btn = document.querySelector('#withdrawal-modal button[onclick="processWithdrawal()"]');

            // Validation
            if (!amount || amount < 500) return alert('Minimum withdrawal is ₦500');
            if (user.balance < amount) return alert(`Insufficient balance: ₦${user.balance.toLocaleString()}`);
            if (!/^(080|081|090|091)\d{8}$/.test(opayNumber)) return alert('Invalid Opay number');

            const feeRate = 0.05; // 5% → you earn this
            const amountToUser = amount * (1 - feeRate);
            const feeEarned = amount * feeRate;

            if (!confirm(`Withdraw ₦${amount.toLocaleString()}?\nYou get ₦${amountToUser.toLocaleString()}.\nTapWealth earns ₦${feeEarned.toLocaleString()}.`)) return;

            btn.disabled = true;
            btn.textContent = 'Processing...';

            // ✅ CORRECTED: No trailing space in URL
            fetch('https://tapwealth-proxy.onrender.com/api/opay/withdraw', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    recipientPhone: opayNumber,
                    amount: amountToUser,
                    reference: `TW_${Date.now()}`,
                    senderName: user.name
                })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.textContent = 'Request Withdrawal';

                if (data.success) {
                    // ✅ Deduct full amount (user pays fee)
                    const newBalance = (user.balance || 0) - amount;
                    const tx = {
                        id: 'wd_' + Date.now(),
                        type: 'debit',
                        description: `Opay withdrawal to ${opayNumber}`,
                        amount: amount,
                        fee: feeEarned,
                        status: 'Completed',
                        date: new Date().toISOString()
                    };

                    saveUser({
                        balance: newBalance,
                        transactions: [...(user.transactions || []), tx]
                    });

                    updateUI();
                    hideWithdrawalModal();
                    alert(`✅ Success! ₦${amountToUser.toLocaleString()} sent to Opay.\nTapWealth earned ₦${feeEarned.toLocaleString()}.`);
                } else {
                    alert(`❌ Failed: ${data.message || 'Try again'}`);
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.textContent = 'Request Withdrawal';
                alert('Network error. Check internet.');
                console.error('Withdrawal error:', err);
            });
        }

        // ✅ Helpers (unchanged)
        function switchCurrency(currency) { /* ... your logic ... */ }
        function showWithdrawalModal() { document.getElementById('withdrawal-modal').classList.remove('hidden'); }
        function hideWithdrawalModal() { /* ... */ }
        function toggleMobileMenu() { /* ... */ }
        function logoutUser() {
            localStorage.removeItem(CURRENT_USER_EMAIL_KEY);
            alert('✅ Logged out!');
            window.location.href = 'login.html';
        }
        function getPendingCashback() { return []; } // Real logic later

        // ✅ INIT
        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
