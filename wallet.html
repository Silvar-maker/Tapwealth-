<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - TapWealth</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; margin: 0; padding: 0; color: #1e293b; }
        .header { background: white; padding: 16px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; }
        .menu-btn { width: 44px; height: 44px; border-radius: 12px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; color: #64748b; border: none; cursor: pointer; }
        .app-title { font-weight: 700; font-size: 18px; color: #0f172a; }
        .balance-card { background: linear-gradient(135deg, #0ea5e9, #3b82f6); color: white; border-radius: 16px; padding: 20px; margin: 16px; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2); }
        .card { background: white; border-radius: 16px; padding: 20px; margin: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .btn { padding: 12px 24px; border-radius: 12px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; width: 100%; margin: 8px 0; }
        .btn-primary { background: #1d4ed8; color: white; }
        .btn-primary:hover { background: #1e40af; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }
        .pay-app-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #94a3b8; text-decoration: none; }
        .nav-item.active { color: #1d4ed8; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .transaction-item { background: #f8fafc; border-left: 4px solid #1d4ed8; padding: 16px; border-radius: 8px; margin: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .transaction-type { font-weight: 600; color: #1e293b; }
        .transaction-amount { font-weight: 600; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; border-radius: 16px; padding: 24px; max-width: 400px; width: 90%; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 14px; color: #333; margin-bottom: 6px; font-weight: 500; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; box-sizing: border-box; }
        .input-group input:focus, .input-group select:focus { border-color: #1d4ed8; box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.2); }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <button onclick="history.back()" class="menu-btn">
            <i class="fas fa-arrow-left text-xl"></i>
        </button>
        <div class="app-title">Wallet</div>
        <div class="w-12"></div>
    </div>

    <!-- Main Content -->
    <div style="padding-bottom: 80px;">
        <!-- Balance Card -->
        <div class="balance-card">
            <div class="flex justify-between items-center">
                <div>
                    <p class="opacity-80">Available Balance</p>
                    <p class="text-3xl font-bold mt-2" id="balance">₦0.00</p>
                </div>
                <i class="fas fa-wallet text-4xl opacity-50"></i>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="card">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="openWithdrawalModal()" class="btn btn-primary">
                    <i class="fas fa-arrow-down mr-2"></i> Withdraw
                </button>
                <button onclick="openTransactionModal()" class="btn" style="background: #10b981; color: white;">
                    <i class="fas fa-arrow-up mr-2"></i> Add Funds
                </button>
            </div>
        </div>

        <!-- Quick Stats -->
        <div class="card">
            <h2 class="text-lg font-bold text-gray-800 mb-4">📊 Statistics</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-blue-50 p-4 rounded-lg text-center">
                    <p class="text-xs text-gray-600">Total Earned</p>
                    <p class="text-xl font-bold text-blue-600" id="total-earned">₦0</p>
                </div>
                <div class="bg-green-50 p-4 rounded-lg text-center">
                    <p class="text-xs text-gray-600">Withdrawn</p>
                    <p class="text-xl font-bold text-green-600" id="total-withdrawn">₦0</p>
                </div>
            </div>
        </div>

        <!-- Transaction History -->
        <div class="card">
            <h2 class="text-lg font-bold text-gray-800 mb-4">📜 Transaction History</h2>
            <div id="transactions-list">
                <div class="text-center py-8 text-gray-500">
                    <i class="fas fa-inbox text-3xl mb-3"></i>
                    <p>No transactions yet</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Withdrawal Modal -->
    <div id="withdrawalModal" class="modal">
        <div class="modal-content">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Withdraw Funds</h2>
            <div class="input-group">
                <label>Amount (₦)</label>
                <input type="number" id="withdrawal-amount" min="500" placeholder="Minimum ₦500" />
            </div>
            <div class="input-group">
                <label>Payment Method</label>
                <select id="payment-method">
                    <option value="opay">Opay</option>
                    <option value="bank">Bank Transfer</option>
                </select>
            </div>
            <div class="input-group">
                <label id="account-label">Opay Phone Number</label>
                <input type="tel" id="account-number" placeholder="08012345678" />
            </div>
            <button onclick="processWithdrawal()" class="btn btn-danger">Request Withdrawal</button>
            <button onclick="closeWithdrawalModal()" class="btn" style="background: #e2e8f0; color: #1e293b;">Cancel</button>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="pay-app-nav">
        <a href="./dashboard.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="./earn.html" class="nav-item">
            <i class="fas fa-coins"></i>
            <span>Earn</span>
        </a>
        <a href="./referral.html" class="nav-item">
            <i class="fas fa-users"></i>
            <span>Refer</span>
        </a>
        <a href="./wallet.html" class="nav-item active">
            <i class="fas fa-wallet"></i>
            <span>Wallet</span>
        </a>
        <a href="./settings.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Me</span>
        </a>
    </div>

    <script>
        const USERS_KEY = 'tapwealth_users';
        const CURRENT_USER_EMAIL_KEY = 'tapwealth_current_user_email';

        function getCurrentUser() {
            const email = localStorage.getItem(CURRENT_USER_EMAIL_KEY);
            if (!email) return null;
            const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
            return users[email] || null;
        }

        function saveUser(data) {
            const email = localStorage.getItem(CURRENT_USER_EMAIL_KEY);
            if (!email) return;
            const users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
            users[email] = { ...users[email], ...data, lastActive: Date.now() };
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
        }

        function updateUI() {
            const user = getCurrentUser();
            if (!user) {
                window.location.href = './login.html';
                return;
            }

            document.getElementById('balance').textContent = '₦' + (user.balance || 0).toLocaleString('en-NG');

            const txs = user.transactions || [];
            const earned = txs.filter(t => t.type === 'credit').reduce((sum, t) => sum + t.amount, 0);
            const withdrawn = txs.filter(t => t.type === 'debit').reduce((sum, t) => sum + t.amount, 0);

            document.getElementById('total-earned').textContent = '₦' + earned.toLocaleString('en-NG');
            document.getElementById('total-withdrawn').textContent = '₦' + withdrawn.toLocaleString('en-NG');

            // Display transactions
            const txList = document.getElementById('transactions-list');
            if (txs.length > 0) {
                txList.innerHTML = txs.slice().reverse().map(tx => `
                    <div class="transaction-item">
                        <div>
                            <p class="transaction-type">${tx.description}</p>
                            <p class="text-xs text-gray-600">${new Date(tx.date).toLocaleDateString()}</p>
                        </div>
                        <p class="transaction-amount" style="color: ${tx.type === 'credit' ? '#10b981' : '#dc2626'}">
                            ${tx.type === 'credit' ? '+' : '-'}₦${tx.amount.toLocaleString('en-NG')}
                        </p>
                    </div>
                `).join('');
            }
        }

        function openWithdrawalModal() {
            document.getElementById('withdrawalModal').classList.add('show');
        }

        function closeWithdrawalModal() {
            document.getElementById('withdrawalModal').classList.remove('show');
        }

        function processWithdrawal() {
            const user = getCurrentUser();
            if (!user) return;

            const amount = parseFloat(document.getElementById('withdrawal-amount').value);
            const method = document.getElementById('payment-method').value;
            const account = document.getElementById('account-number').value.trim();

            if (!amount || amount < 500) return alert('⚠️ Minimum withdrawal is ₦500');
            if ((user.balance || 0) < amount) return alert('❌ Insufficient balance');
            if (!account) return alert('⚠️ Please enter account details');

            if (confirm(`Withdraw ₦${amount.toLocaleString('en-NG')}?`)) {
                saveUser({
                    balance: (user.balance || 0) - amount,
                    transactions: [
                        ...(user.transactions || []),
                        {
                            id: 'wd_' + Date.now(),
                            type: 'debit',
                            amount: amount,
                            description: `Withdrawal to ${method.toUpperCase()}`,
                            date: new Date().toISOString(),
                            status: 'pending',
                            method: method,
                            account: account
                        }
                    ]
                });

                updateUI();
                closeWithdrawalModal();
                alert('✅ Withdrawal request submitted! You will receive your funds in 24-48 hours.');
                document.getElementById('withdrawal-amount').value = '';
                document.getElementById('account-number').value = '';
            }
        }

        function openTransactionModal() {
            alert('💡 Add funds by completing tasks, watching ads, or referring friends!');
        }

        document.getElementById('payment-method').addEventListener('change', function() {
            const label = document.getElementById('account-label');
            const input = document.getElementById('account-number');
            if (this.value === 'opay') {
                label.textContent = 'Opay Phone Number';
                input.placeholder = '08012345678';
            } else {
                label.textContent = 'Bank Account Number';
                input.placeholder = '1234567890';
            }
        });

        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
