<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TapWealth</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@700&family=SF+Pro+Text:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ✅ Your existing CSS — unchanged */
        body { font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f0f2f5; }
        h1, h2, h3, h4, h5, h6 { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif; }
        .facebook-blue { background-color: #1877F2; }
        .facebook-dark { background-color: #1C1E21; }
        .facebook-light { background-color: #f0f2f5; }
        .facebook-card { background-color: white; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .facebook-header { background-color: white; border-bottom: 1px solid #dddfe2; }
        .facebook-button { background-color: #1877F2; color: white; border: none; border-radius: 6px; padding: 8px 16px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        .facebook-button:hover { background-color: #166fe5; }
        .facebook-button.secondary { background-color: #e4e6eb; color: #1c1e21; }
        .facebook-button.secondary:hover { background-color: #d8dadf; }
        .facebook-input { border: 1px solid #dddfe2; border-radius: 6px; padding: 14px 16px; width: 100%; margin-bottom: 12px; }
        .facebook-input:focus { outline: none; border-color: #1877F2; box-shadow: 0 0 0 2px #e7f3ff; }
        .facebook-input-group { display: flex; gap: 12px; }
        .facebook-input-group .facebook-input { margin-bottom: 0; }
        @media (max-width: 768px) {
            .facebook-input-group { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body class="facebook-light min-h-screen flex items-center justify-center p-4">
    <!-- ... unchanged HTML (same as yours) ... -->

    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const firstName = document.getElementById('first-name').value.trim();
            const lastName = document.getElementById('last-name').value.trim();
            const email = document.getElementById('register-email').value.trim().toLowerCase();
            const password = document.getElementById('register-password').value;
            const day = document.getElementById('day').value;
            const month = document.getElementById('month').value;
            const year = document.getElementById('year').value;
            const gender = document.querySelector('input[name="gender"]:checked')?.value;
            
            if (!firstName || !lastName || !email || !password || !day || !month || !year || !gender) {
                alert('Please fill in all required fields!');
                return;
            }
            if (password.length < 6) {
                alert('Password must be at least 6 characters long!');
                return;
            }

            // ✅ FIX: Use same storage key as login.html & dashboard.html
            const USERS_KEY = 'tapwealth_users';
            const CURRENT_USER_EMAIL_KEY = 'tapwealth_current_user_email';

            let users = JSON.parse(localStorage.getItem(USERS_KEY)) || {};
            if (users[email]) {
                alert('Email already registered!');
                return;
            }

            // ✅ FIXED: Unified user schema (matches login.html & dashboard.html)
            const userId = 'user_' + Math.random().toString(36).substr(2, 9);
            const newUser = {
                email: email,
                password: password,
                name: firstName + ' ' + lastName,
                role: 'user',          // ✅ Required for admin menu
                id: userId,            // ✅ String ID (for referrals)
                balance: 500,          // Welcome bonus
                taps: 0,               // ✅ Required for tap counter
                referrals: [],         // ✅ Array (not number)
                completedTasks: 0,
                createdAt: new Date().toISOString(),
                transactions: [{
                    id: 'welcome_' + userId,
                    type: 'credit',
                    description: 'Welcome Bonus',
                    amount: 500,
                    date: new Date().toISOString()
                }]
            };

            // Save user
            users[email] = newUser;
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
            localStorage.setItem(CURRENT_USER_EMAIL_KEY, email); // ✅ String key only

            // Verify save succeeded
            if (localStorage.getItem(CURRENT_USER_EMAIL_KEY) !== email) {
                alert('⚠️ Storage failed. Try incognito mode.');
                return;
            }

            alert(`✅ Account created!\n\n₦500 welcome bonus added.\n\nYour ID: ${userId}`);
            window.location.href = 'dashboard.html'; // ✅ Go to dashboard (not index)
        });
    </script>
</body>
</html>
